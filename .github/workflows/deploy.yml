# Publishes the app to Cloudflare. It runs only after it has been switched on:
#   1. Add repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID
#      (GitHub → Settings → Secrets and variables → Actions → Secrets).
#   2. Optional: add a repository variable AUTO_DEPLOY = true to publish on every push to main.
#      Without it, publish by hand from GitHub → Actions → Deploy → Run workflow.
# See docs/go-live-checklist.md.
name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || vars.AUTO_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check the Cloudflare secrets are set
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository secrets first (docs/go-live-checklist.md)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Refuse to deploy with the placeholder database id
        run: |
          if grep -q '00000000-0000-0000-0000-000000000000' apps/api/wrangler.jsonc; then
            echo "::error::Put your real D1 database_id in apps/api/wrangler.jsonc (setup guide, step 3)."
            exit 1
          fi
      - name: Apply database changes
        working-directory: apps/api
        run: npx wrangler d1 migrations apply mausam --remote
      - name: Publish
        working-directory: apps/api
        run: npx wrangler deploy
      - name: Check the live app answers
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -n "$APP_URL" ]; then
            sleep 5
            curl -fsS --retry 3 --retry-delay 5 "$APP_URL/api/health"
          else
            echo "Set a repository variable APP_URL (e.g. https://mausam-admin.example.workers.dev) to check the live app after each deploy."
          fi
