# Checks every pull request and every push to main: types, tests and a production build.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Catches config mistakes (bad bindings, missing assets) without a Cloudflare account.
      - name: Check the Worker bundles
        working-directory: apps/api
        run: npx wrangler deploy --dry-run --outdir ../../.wrangler-dry-run
