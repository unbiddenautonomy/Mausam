# Types, tests, a production build and a Worker bundle check.
# Actions minutes are limited, so this runs ONLY when started by hand
# (Actions tab > CI > "Run workflow"). Pull requests and pushes start nothing.
# Before every push or merge, run the same checks locally: `pnpm check`.
name: CI

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Catches config mistakes (bad bindings, missing assets) without a Cloudflare account.
      - name: Check the Worker bundles
        working-directory: apps/api
        run: npx wrangler deploy --dry-run --outdir ../../.wrangler-dry-run
