# Checks every pull request: types, tests and a production build.
# Actions minutes are limited, so it does not run again when a PR merges into main
# (use "Run workflow" to check main by hand), and docs-only changes run nothing.
name: CI

on:
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Catches config mistakes (bad bindings, missing assets) without a Cloudflare account.
      - name: Check the Worker bundles
        working-directory: apps/api
        run: npx wrangler deploy --dry-run --outdir ../../.wrangler-dry-run
